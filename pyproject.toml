[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-one-user-one-agent"
version = "1.0.0"
description = "Evidence-first per-viewer agent baseline for the STAGE hiring challenge"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
stage-agent = "stage_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
